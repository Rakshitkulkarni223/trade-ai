# Optional infrastructure only. The app runs without any of this (SQLite + in-memory cache).
# Not exercised in development here; point DATABASE_URL / REDIS_URL at these if you want them:
#   DATABASE_URL=postgresql+psycopg://tradeai:tradeai@localhost:5432/tradeai   (pip install "psycopg[binary]")
#   REDIS_URL=redis://localhost:6379/0
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: tradeai, POSTGRES_PASSWORD: tradeai, POSTGRES_DB: tradeai }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
